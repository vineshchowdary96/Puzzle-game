<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slide &amp; Solve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --panel:#232E3F;
    --cream:#F5F0E6;
    --mustard:#E8A33D;
    --teal:#2E8B87;
    --coral:#E4634B;
    --line: rgba(245,240,230,0.14);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:inherit;}
  html{height:100%; scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    margin:0; min-height:100%;
    background:var(--ink);
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 48px;
  }
  h1{
    font-family:'Fredoka',system-ui,sans-serif;
    font-weight:600;
    font-size:clamp(28px,5vw,40px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:rgba(245,240,230,0.6);
    font-size:15px;
    margin:0 0 28px;
    text-align:center;
    max-width:420px;
  }
  .stats{
    display:flex; gap:28px; margin-bottom:18px;
    font-family:'Fredoka',system-ui,sans-serif;
  }
  .stat{ text-align:center; }
  .stat .num{ font-size:26px; font-weight:600; color:var(--mustard); line-height:1; }
  .stat .lbl{ font-size:11px; color:rgba(245,240,230,0.5); margin-top:4px; }

  .board-wrap{
    position:relative;
    width:min(360px, 88vw);
    aspect-ratio:1/1;
    background:var(--panel);
    border-radius:16px;
    padding:8px;
    box-shadow: 0 20px 40px -18px rgba(0,0,0,0.6);
  }
  .board{
    position:relative;
    width:100%; height:100%;
    border-radius:10px;
    overflow:hidden;
  }
  .tile{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka',system-ui,sans-serif;
    font-weight:600;
    font-size:22px;
    color:var(--ink);
    background:var(--cream);
    border-radius:8px;
    cursor:pointer;
    transition: top .16s ease, left .16s ease, filter .12s ease;
    background-size: 400% 400%;
    background-position: center;
    user-select:none;
    box-shadow: inset 0 0 0 1px rgba(27,36,48,0.08);
  }
  .tile:hover{ filter:brightness(1.05); }
  .tile.image-mode{ color:transparent; }

  .win-banner{
    position:absolute; inset:8px;
    border-radius:10px;
    display:none;
    align-items:center; justify-content:center; flex-direction:column;
    background:rgba(27,36,48,0.72);
    backdrop-filter: blur(2px);
    text-align:center; padding:16px;
  }
  .win-banner.show{ display:flex; }
  .win-banner .title{
    font-family:'Fredoka',system-ui,sans-serif;
    font-size:24px; font-weight:600; color:var(--mustard);
    margin-bottom:6px;
  }
  .win-banner .msg{ font-size:14px; color:var(--cream); opacity:0.85; }

  .controls{
    display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; justify-content:center;
  }
  button, .filebtn{
    font-family:'Inter',system-ui,sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    transition: transform .08s ease, filter .12s ease;
  }
  button:active, .filebtn:active{ transform: scale(0.96); }
  .btn-primary{ background:var(--mustard); color:var(--ink); }
  .btn-secondary{ background:transparent; color:var(--cream); border:1px solid var(--line); }
  .btn-primary:hover, .btn-secondary:hover{ filter:brightness(1.08); }

  .size-row{
    display:flex; gap:8px; margin-top:16px; align-items:center;
    font-size:13px; color:rgba(245,240,230,0.6);
  }
  .size-row select{
    background:var(--panel); color:var(--cream);
    border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; font-family:'Inter',sans-serif; font-size:13px;
  }
  input[type=file]{ display:none; }

  footer{
    margin-top:36px; font-size:12px; color:rgba(245,240,230,0.35);
    text-align:center;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]){ }
  }
</style>
</head>
<body>

  <h1>Slide &amp; Solve</h1>
  <p class="sub">Arrange the tiles in order, or upload a photo and reassemble it. Built as a full-stack practice project.</p>

  <div class="stats">
    <div class="stat"><div class="num" id="moveCount">0</div><div class="lbl">MOVES</div></div>
    <div class="stat"><div class="num" id="timeCount">0:00</div><div class="lbl">TIME</div></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="win-banner" id="winBanner">
      <div class="title">Solved!</div>
      <div class="msg" id="winMsg"></div>
    </div>
  </div>

  <div class="size-row">
    <span>Grid size:</span>
    <select id="sizeSelect">
      <option value="3">3 × 3</option>
      <option value="4" selected>4 × 4</option>
      <option value="5">5 × 5</option>
    </select>
  </div>

  <div class="controls">
    <button class="btn-primary" id="shuffleBtn">Shuffle</button>
    <label class="filebtn btn-secondary" for="imgInput">Use my photo</label>
    <input type="file" id="imgInput" accept="image/*">
    <button class="btn-secondary" id="numbersBtn">Use numbers</button>
  </div>

  <footer>No image leaves your browser — everything runs locally.</footer>

<script>
(function(){
  const board = document.getElementById('board');
  const winBanner = document.getElementById('winBanner');
  const winMsg = document.getElementById('winMsg');
  const moveCountEl = document.getElementById('moveCount');
  const timeCountEl = document.getElementById('timeCount');
  const sizeSelect = document.getElementById('sizeSelect');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const numbersBtn = document.getElementById('numbersBtn');
  const imgInput = document.getElementById('imgInput');

  let N = 4;
  let tiles = [];
  let emptyIndex;
  let moves = 0;
  let seconds = 0;
  let timerId = null;
  let running = false;
  let imageURL = null;

  function fmtTime(s){
    const m = Math.floor(s/60), sec = s%60;
    return m + ':' + String(sec).padStart(2,'0');
  }

  function startTimer(){
    if (timerId) return;
    running = true;
    timerId = setInterval(()=>{ seconds++; timeCountEl.textContent = fmtTime(seconds); }, 1000);
  }
  function stopTimer(){
    clearInterval(timerId); timerId = null; running = false;
  }
  function resetTimer(){
    stopTimer(); seconds = 0; timeCountEl.textContent = '0:00';
  }

  function buildSolvedArray(n){
    const arr = [];
    for (let i=0;i<n*n-1;i++) arr.push(i+1);
    arr.push(0); // 0 = blank
    return arr;
  }

  function isSolvable(arr, n){
    const flat = arr.filter(v=>v!==0);
    let inv = 0;
    for (let i=0;i<flat.length;i++)
      for (let j=i+1;j<flat.length;j++)
        if (flat[i] > flat[j]) inv++;
    const blankRowFromBottom = n - Math.floor(arr.indexOf(0)/n);
    if (n % 2 === 1) return inv % 2 === 0;
    if (blankRowFromBottom % 2 === 0) return inv % 2 === 1;
    return inv % 2 === 0;
  }

  function shuffle(n){
    let arr;
    do {
      arr = buildSolvedArray(n);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    } while (!isSolvable(arr, n) || isSolved(arr, n));
    return arr;
  }

  function isSolved(arr, n){
    const solved = buildSolvedArray(n);
    return arr.every((v,i)=>v===solved[i]);
  }

  function render(){
    board.innerHTML = '';
    const gap = 6;
    const cellPct = 100 / N;
    tiles.forEach((val, idx) => {
      if (val === 0) { emptyIndex = idx; return; }
      const row = Math.floor(idx / N), col = idx % N;
      const tile = document.createElement('div');
      tile.className = 'tile' + (imageURL ? ' image-mode' : '');
      tile.style.width = `calc(${cellPct}% - ${gap}px)`;
      tile.style.height = `calc(${cellPct}% - ${gap}px)`;
      tile.style.top = `calc(${row * cellPct}% + ${gap/2}px)`;
      tile.style.left = `calc(${col * cellPct}% + ${gap/2}px)`;
      tile.textContent = imageURL ? '' : val;
      if (imageURL){
        const origRow = Math.floor((val-1)/N), origCol = (val-1)%N;
        tile.style.backgroundImage = `url(${imageURL})`;
        tile.style.backgroundSize = `${N*100}% ${N*100}%`;
        tile.style.backgroundPosition = `${(origCol/(N-1))*100}% ${(origRow/(N-1))*100}%`;
      }
      tile.addEventListener('click', () => tryMove(idx));
      board.appendChild(tile);
    });
  }

  function tryMove(idx){
    const row = Math.floor(idx / N), col = idx % N;
    const eRow = Math.floor(emptyIndex / N), eCol = emptyIndex % N;
    const adjacent = (Math.abs(row-eRow) + Math.abs(col-eCol)) === 1;
    if (!adjacent) return;
    [tiles[idx], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[idx]];
    moves++;
    moveCountEl.textContent = moves;
    if (!running) startTimer();
    render();
    if (isSolved(tiles, N)) {
      stopTimer();
      winMsg.textContent = `${moves} moves · ${fmtTime(seconds)}`;
      winBanner.classList.add('show');
    }
  }

  function newGame(){
    N = parseInt(sizeSelect.value, 10);
    tiles = shuffle(N);
    moves = 0;
    moveCountEl.textContent = 0;
    resetTimer();
    winBanner.classList.remove('show');
    render();
  }

  shuffleBtn.addEventListener('click', newGame);
  sizeSelect.addEventListener('change', newGame);

  numbersBtn.addEventListener('click', () => {
    imageURL = null;
    render();
  });

  imgInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      imageURL = ev.target.result;
      render();
    };
    reader.readAsDataURL(file);
  });

  newGame();
})();
</script>
</body>
</html>
